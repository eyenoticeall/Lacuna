[package]
name = "lacuna-python"
description = "Python bindings for the Lacuna native core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib"]
doctest = false
test = false

[dependencies]
lacuna-core = { path = "../lacuna-core" }
numpy = "0.29.0"
pyo3 = { version = "0.29.2", features = ["abi3-py311"] }

[lints]
workspace = true
