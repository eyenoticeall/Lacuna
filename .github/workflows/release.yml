name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact main-branch commit SHA to rehearse
        required: true
        type: string
      core_version:
        description: Expected lacuna-quant version
        required: true
        type: string
      options_version:
        description: Expected lacuna-options version
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  EXPECTED_CORE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.core_version || '' }}
  EXPECTED_OPTIONS_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.options_version || '' }}
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.ref }}
  RELEASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.sha }}
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.core_version) || github.ref_name }}
  RUST_BACKTRACE: "1"
  UV_NO_PROGRESS: "1"

jobs:
  verify-source:
    name: Verify release source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      checks: read
      contents: read
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_REF }}
      - name: Verify version, changelog, contract, and exact tag
        run: |
          arguments=(source --tag "$RELEASE_TAG" --expected-commit "$RELEASE_SHA")
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            arguments+=(--require-tag)
          else
            arguments+=(--expected-core-version "$EXPECTED_CORE_VERSION")
            arguments+=(--expected-options-version "$EXPECTED_OPTIONS_VERSION")
          fi
          python .github/scripts/verify_release.py "${arguments[@]}"
      - name: Resolve source package versions
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import tomllib

          core = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          options = tomllib.loads(
              Path("extensions/lacuna-options/pyproject.toml").read_text(encoding="utf-8")
          )
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as environment:
              environment.write(f"SOURCE_CORE_VERSION={core['project']['version']}\n")
              environment.write(f"SOURCE_OPTIONS_VERSION={options['project']['version']}\n")
          PY
      - name: Require the release commit on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
      - name: Require a successful CI gate for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          success_count="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_SHA}/check-runs" \
            --jq '[.check_runs[] | select(.name == "CI gate" and .conclusion == "success")] | length')"
          if [[ "$success_count" == "0" ]]; then
            printf 'CI gate for %s has no successful check run.\n' "$RELEASE_SHA"
            exit 1
          fi
      - name: Require an exact-SHA non-publishing preflight before a tag release
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_ids="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/runs" \
            -f event=workflow_dispatch \
            -f status=success \
            -f per_page=20 \
            --jq '.workflow_runs[].id')"
          verified=false
          for run_id in $run_ids; do
            destination="preflight-${run_id}"
            if ! gh run download "$run_id" \
              --name "release-preflight-${RELEASE_SHA}" \
              --dir "$destination"; then
              continue
            fi
            if python .github/scripts/release_preflight.py verify \
              --manifest "$destination/release-preflight.json" \
              --source-commit "$RELEASE_SHA" \
              --core-version "$SOURCE_CORE_VERSION" \
              --options-version "$SOURCE_OPTIONS_VERSION"; then
              verified=true
              break
            fi
          done
          if [[ "$verified" != "true" ]]; then
            printf 'No valid non-publishing preflight exists for %s.\n' "$RELEASE_SHA"
            exit 1
          fi

  rehearsal-gates:
    name: Release rehearsal / Python, Rust, docs, contracts
    needs: verify-source
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_REF }}
      - name: Install Rust with quality components
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        with:
          toolchain: stable
          components: clippy,rustfmt
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: "3.13"
          enable-cache: true
          cache-suffix: release-rehearsal
      - name: Install every locked development and documentation dependency
        run: uv sync --frozen --all-packages --group dev --group docs --extra all
      - name: Run Python formatting, lint, and type gates
        run: |
          uv run --no-sync ruff format --check .
          uv run --no-sync ruff check .
          uv run --no-sync mypy
          uv run --no-sync mypy --config-file extensions/lacuna-options/pyproject.toml extensions/lacuna-options/src/lacuna_options
      - name: Run the complete core suite with no unexpected skips
        run: >-
          uv run --no-sync pytest
          --ignore=tests/browser
          --fail-on-skip
          --cov=lacuna
          --cov-branch
          --cov-fail-under=80
          --junitxml=release-core-junit.xml
      - name: Run the options suite and coverage gate
        run: >-
          uv run --no-sync pytest extensions/lacuna-options/tests
          --cov=lacuna_options
          --cov-branch
          --cov-fail-under=85
          --junitxml=release-options-junit.xml
      - name: Audit the locked Rust graph against current RustSec advisories
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit --deny warnings --file Cargo.lock
      - name: Run Rust format, dependency, lint, test, and benchmark-compile gates
        run: |
          cargo fmt --all --check
          python .github/scripts/check_rust_boundary.py
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
          cargo bench --locked --bench kernels --no-run
      - name: Validate every committed migration artifact and terminal decision
        run: |
          for artifact in benchmarks/native-migration/*.json; do
            uv run --no-sync python .github/scripts/native_migration_benchmark.py validate "$artifact"
          done
          python .github/scripts/release_preflight.py ledger --require-terminal
      - name: Build the handbook in strict mode
        run: uv run --no-sync mkdocs build --strict
      - name: Retain release rehearsal evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-rehearsal-tests
          path: |
            release-core-junit.xml
            release-options-junit.xml
          if-no-files-found: error
          retention-days: 90

  statistical-qa:
    name: Release statistical calibration / 500 simulations
    needs: verify-source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_REF }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        with:
          toolchain: stable
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: "3.13"
          enable-cache: true
          cache-suffix: release-statistical-qa
      - name: Install the statistics test environment
        run: uv sync --frozen --group dev --extra statistics
      - name: Check decay coverage and event pointwise/simultaneous error rates
        env:
          LACUNA_RELEASE_CALIBRATION_SIMULATIONS: "500"
        run: >-
          uv run --no-sync pytest
          tests/statistical/test_decay_event_release_calibration.py
          --fail-on-skip
          --junitxml=release-statistical-junit.xml
      - name: Retain release statistical evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-statistical-calibration
          path: release-statistical-junit.xml
          if-no-files-found: error
          retention-days: 90

  native-admission:
    name: Release native admission / medium tier
    needs: verify-source
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LACUNA_SOURCE_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.sha }}
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      POLARS_MAX_THREADS: "2"
    steps:
      - name: Check out the exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_REF }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        with:
          toolchain: stable
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: "3.13"
          enable-cache: true
          cache-suffix: release-native-admission
      - name: Install the locked native test environment
        run: uv sync --frozen --group dev
      - name: Prepare native evidence directory
        run: mkdir -p native-admission
      - name: Reproduce grouped-IC admission on skewed groups
        run: >-
          uv run --no-sync python .github/scripts/native_migration_benchmark.py run
          --candidate-id R-01
          --public-operation signal.ic
          --reference-case migration.signal.ic.skewed.reference
          --candidate-case migration.signal.ic.skewed.native
          --tier medium
          --warmups 2
          --repetitions 7
          --dimension rows=1625750
          --dimension groups=1000
          --dimension horizons=3
          --dimension 'group_shape="cyclic:3,250,1250,5000"'
          --public-latency-share 1.0
          --absolute-tolerance 1e-14
          --out native-admission/r01.json
      - name: Reproduce PBO admission
        run: >-
          uv run --no-sync python .github/scripts/native_migration_benchmark.py run
          --candidate-id R-08
          --public-operation validation.probability_of_backtest_overfitting
          --reference-case migration.validation.pbo.reference
          --candidate-case migration.validation.pbo.native
          --tier medium
          --warmups 2
          --repetitions 7
          --dimension rows=1008
          --dimension strategies=12
          --dimension partitions=14
          --dimension combinations=3432
          --public-latency-share 1.0
          --absolute-tolerance 1e-12
          --relative-tolerance 1e-12
          --out native-admission/r08.json
      - name: Require exact-source native admission evidence
        run: |
          uv run --no-sync python .github/scripts/native_migration_benchmark.py validate native-admission/r01.json --candidate-id R-01 --source-commit "$RELEASE_SHA" --require-state ADMITTED
          uv run --no-sync python .github/scripts/native_migration_benchmark.py validate native-admission/r08.json --candidate-id R-08 --source-commit "$RELEASE_SHA" --require-state ADMITTED
      - name: Retain release native evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-native-admission
          path: native-admission/*.json
          if-no-files-found: error
          retention-days: 90

  source-distribution:
    name: Source distribution
    needs: [verify-source, statistical-qa, native-admission]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_REF }}
      - name: Build the source distribution
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          maturin-version: v1.14.1
          args: --out dist
      - name: Retain the source distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  wheels:
    name: Wheel / ${{ matrix.platform }}
    needs: [verify-source, statistical-qa]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
            smoke-python: .wheel-smoke/bin/python
            smoke-cli: .wheel-smoke/bin/lacuna
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
            smoke-python: .wheel-smoke/bin/python
            smoke-cli: .wheel-smoke/bin/lacuna
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            manylinux: "off"
            smoke-python: .wheel-smoke/bin/python
            smoke-cli: .wheel-smoke/bin/lacuna
          - platform: windows-x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            manylinux: "off"
            smoke-python: .wheel-smoke/Scripts/python.exe
            smoke-cli: .wheel-smoke/Scripts/lacuna.exe
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_REF }}
      - name: Install Python for wheel smoke testing
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: "3.13"
          enable-cache: true
          cache-suffix: release-${{ matrix.platform }}
      - name: Build the native wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.14.1
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --compatibility pypi --out dist
      - name: Install the wheel in a clean environment
        run: |
          uv venv .wheel-smoke --python 3.13
          uv pip install --python "${{ matrix.smoke-python }}" dist/*.whl
      - name: Exercise the installed wheel and native extension
        run: |
          "${{ matrix.smoke-python }}" .github/scripts/wheel_smoke.py
          "${{ matrix.smoke-cli }}" doctor --json --strict
      - name: Retain the verified wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-wheel-${{ matrix.platform }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 30

  abi3:
    name: Release ABI3 / same Linux wheel / Python ${{ matrix.python-version }}
    needs: wheels
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out release smoke contracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_REF }}
      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: ${{ matrix.python-version }}
          enable-cache: false
      - name: Download the exact Linux cp311-abi3 wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-wheel-linux-x86_64
          path: dist
      - name: Install without rebuilding
        run: |
          uv venv .abi-smoke --python ${{ matrix.python-version }}
          uv pip install --python .abi-smoke/bin/python dist/lacuna_quant-*.whl
      - name: Exercise typed arrays, grouped IC, PBO, and public parity
        run: |
          .abi-smoke/bin/python .github/scripts/wheel_smoke.py
          .abi-smoke/bin/lacuna doctor --json --strict

  options-distribution:
    name: Options extension distribution
    needs: [verify-source, wheels]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_REF }}
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: "3.13"
          enable-cache: true
          cache-suffix: release-options
      - name: Install the locked pure-Python build backend
        run: uv sync --frozen --group dev --no-install-project
      - name: Build the options wheel and source distribution
        run: >-
          uv build --package lacuna-options
          --no-build-isolation
          --out-dir dist/options
      - name: Download the verified Linux core wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-wheel-linux-x86_64
          path: dist/core
      - name: Install both distributions into a clean environment
        run: |
          uv venv .options-smoke --python 3.13
          uv pip install --python .options-smoke/bin/python dist/core/*.whl dist/options/*.whl
      - name: Exercise the installed options extension
        run: .options-smoke/bin/python .github/scripts/options_wheel_smoke.py
      - name: Retain the options distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-options-distributions
          path: |
            dist/options/*.whl
            dist/options/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  options-compatibility:
    name: Options / core 0.13 and 0.14 compatibility
    needs: [wheels, options-distribution]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out extension smoke contracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_REF }}
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: "3.13"
          enable-cache: false
      - name: Download the current core wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-wheel-linux-x86_64
          path: dist/core
      - name: Download the options wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-options-distributions
          path: dist/options
      - name: Verify the lower supported core minor
        run: |
          uv venv .options-core-013 --python 3.13
          uv pip install --python .options-core-013/bin/python "lacuna-quant==0.13.0" dist/options/lacuna_options-*.whl
          .options-core-013/bin/python .github/scripts/options_wheel_smoke.py
      - name: Verify the release core minor
        run: |
          uv venv .options-core-014 --python 3.13
          uv pip install --python .options-core-014/bin/python dist/core/lacuna_quant-*.whl dist/options/lacuna_options-*.whl
          .options-core-014/bin/python .github/scripts/options_wheel_smoke.py

  verify-artifacts:
    name: Verify distribution set
    needs: [rehearsal-gates, source-distribution, wheels, options-distribution, options-compatibility, abi3, native-admission]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_REF }}
      - name: Download every release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify filenames, tags, metadata, and packaged resources
        run: python .github/scripts/verify_release.py artifacts --tag "$RELEASE_TAG" --dist dist
      - name: Retain the verified release set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-release-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 90

  preflight-manifest:
    name: Write exact-SHA non-publishing preflight
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: [verify-source, rehearsal-gates, statistical-qa, native-admission, source-distribution, wheels, abi3, options-distribution, options-compatibility, verify-artifacts]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out the exact preflight source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_REF }}
      - name: Download the verified distribution set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-release-distributions
          path: dist
      - name: Download exact-source native admission evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-native-admission
          path: native-admission
      - name: Bind every gate, artifact, and candidate decision to the source SHA
        run: >-
          python .github/scripts/release_preflight.py create
          --source-commit "$RELEASE_SHA"
          --core-version "$EXPECTED_CORE_VERSION"
          --options-version "$EXPECTED_OPTIONS_VERSION"
          --dist dist
          --native-benchmarks native-admission
          --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          --gate ci=success
          --gate statistical_calibration=success
          --gate native_admission=success
          --gate options_compatibility=success
          --gate release_rehearsal=success
          --gate source_distribution=success
          --gate target_wheels=success
          --gate same_wheel_abi=success
          --gate artifact_validation=success
          --out release-preflight.json
      - name: Retain the immutable preflight evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-preflight-${{ env.RELEASE_SHA }}
          path: |
            release-preflight.json
            native-admission/*.json
          if-no-files-found: error
          retention-days: 90

  github-release:
    name: Publish GitHub release
    if: ${{ github.event_name == 'push' }}
    needs: verify-artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_REF }}
      - name: Download the verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-release-distributions
          path: dist
      - name: Attest every distribution from its checksum manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            dist/*.whl dist/*.tar.gz dist/SHA256SUMS \
            --verify-tag \
            --title "Lacuna $RELEASE_TAG" \
            --notes-file ".github/release-notes/${RELEASE_TAG}.md" \
            "${release_flags[@]}"

  pypi-core:
    name: Publish lacuna-quant to PyPI
    if: ${{ github.event_name == 'push' }}
    needs: github-release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/lacuna-quant/
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Download the verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-release-distributions
          path: dist
      - name: Isolate the core distribution set
        run: |
          mkdir -p publish/core
          cp dist/lacuna_quant-*.whl dist/lacuna_quant-*.tar.gz publish/core/
      - name: Publish the verified core distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1 2026-08-27
        with:
          packages-dir: publish/core/
          skip-existing: true

  pypi-options:
    name: Publish lacuna-options to PyPI
    if: ${{ github.event_name == 'push' }}
    needs: pypi-core
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi-options
      url: https://pypi.org/project/lacuna-options/
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Download the verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-release-distributions
          path: dist
      - name: Isolate the options distribution set
        run: |
          mkdir -p publish/options
          cp dist/lacuna_options-*.whl dist/lacuna_options-*.tar.gz publish/options/
      - name: Publish the verified options distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1 2026-08-27
        with:
          packages-dir: publish/options/
          skip-existing: true

  pypi-smoke:
    name: PyPI installation smoke
    if: ${{ github.event_name == 'push' }}
    needs: pypi-options
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out release smoke tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_REF }}
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: "3.13"
          enable-cache: false
      - name: Resolve the exact published versions
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import tomllib

          root = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          options = tomllib.loads(
              Path("extensions/lacuna-options/pyproject.toml").read_text(encoding="utf-8")
          )
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as environment:
              environment.write(f"CORE_VERSION={root['project']['version']}\n")
              environment.write(f"OPTIONS_VERSION={options['project']['version']}\n")
          PY
      - name: Install both distributions from PyPI
        run: |
          uv venv .pypi-smoke --python 3.13
          installed=false
          for attempt in {1..18}; do
            if uv pip install \
              --python .pypi-smoke/bin/python \
              --refresh \
              --index-url https://pypi.org/simple \
              "lacuna-quant==$CORE_VERSION" \
              "lacuna-options==$OPTIONS_VERSION"; then
              installed=true
              break
            fi
            printf 'PyPI has not indexed both distributions yet (attempt %s/18).\n' "$attempt"
            sleep 10
          done
          if [[ "$installed" != "true" ]]; then
            exit 1
          fi
      - name: Exercise the PyPI-installed distributions
        run: |
          .pypi-smoke/bin/python .github/scripts/wheel_smoke.py
          .pypi-smoke/bin/python .github/scripts/options_wheel_smoke.py
          .pypi-smoke/bin/lacuna doctor --json --strict

  preflight-gate:
    name: Release preflight gate
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
    needs: [verify-source, rehearsal-gates, statistical-qa, native-admission, source-distribution, wheels, abi3, options-distribution, options-compatibility, verify-artifacts, preflight-manifest]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require every non-publishing preflight layer
        env:
          ABI3: ${{ needs.abi3.result }}
          MANIFEST: ${{ needs.preflight-manifest.result }}
          NATIVE_ADMISSION: ${{ needs.native-admission.result }}
          OPTIONS: ${{ needs.options-distribution.result }}
          OPTIONS_COMPATIBILITY: ${{ needs.options-compatibility.result }}
          REHEARSAL: ${{ needs.rehearsal-gates.result }}
          RELEASE_ARTIFACTS: ${{ needs.verify-artifacts.result }}
          RELEASE_SOURCE: ${{ needs.verify-source.result }}
          STATISTICAL_QA: ${{ needs.statistical-qa.result }}
          SDIST: ${{ needs.source-distribution.result }}
          WHEELS: ${{ needs.wheels.result }}
        run: |
          for result in "$RELEASE_SOURCE" "$REHEARSAL" "$STATISTICAL_QA" "$NATIVE_ADMISSION" "$SDIST" "$WHEELS" "$ABI3" "$OPTIONS" "$OPTIONS_COMPATIBILITY" "$RELEASE_ARTIFACTS" "$MANIFEST"; do
            if [[ "$result" != "success" ]]; then
              printf 'A required preflight layer finished with status: %s\n' "$result"
              exit 1
            fi
          done

  gate:
    name: Release gate
    if: ${{ !cancelled() && github.event_name == 'push' }}
    needs: [verify-source, rehearsal-gates, statistical-qa, native-admission, source-distribution, wheels, abi3, options-distribution, options-compatibility, verify-artifacts, github-release, pypi-core, pypi-options, pypi-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require every release layer
        env:
          GITHUB_RELEASE: ${{ needs.github-release.result }}
          NATIVE_ADMISSION: ${{ needs.native-admission.result }}
          PYPI_CORE: ${{ needs.pypi-core.result }}
          PYPI_OPTIONS: ${{ needs.pypi-options.result }}
          PYPI_SMOKE: ${{ needs.pypi-smoke.result }}
          RELEASE_ARTIFACTS: ${{ needs.verify-artifacts.result }}
          RELEASE_SOURCE: ${{ needs.verify-source.result }}
          REHEARSAL: ${{ needs.rehearsal-gates.result }}
          STATISTICAL_QA: ${{ needs.statistical-qa.result }}
          SDIST: ${{ needs.source-distribution.result }}
          WHEELS: ${{ needs.wheels.result }}
          ABI3: ${{ needs.abi3.result }}
          OPTIONS: ${{ needs.options-distribution.result }}
          OPTIONS_COMPATIBILITY: ${{ needs.options-compatibility.result }}
        run: |
          for result in "$RELEASE_SOURCE" "$REHEARSAL" "$STATISTICAL_QA" "$NATIVE_ADMISSION" "$SDIST" "$WHEELS" "$ABI3" "$OPTIONS" "$OPTIONS_COMPATIBILITY" "$RELEASE_ARTIFACTS" "$GITHUB_RELEASE" "$PYPI_CORE" "$PYPI_OPTIONS" "$PYPI_SMOKE"; do
            if [[ "$result" != "success" ]]; then
              printf 'A required release layer finished with status: %s\n' "$result"
              exit 1
            fi
          done
