name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  UV_NO_PROGRESS: "1"

jobs:
  verify-source:
    name: Verify release source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      checks: read
      contents: read
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify version, changelog, contract, and exact tag
        run: python .github/scripts/verify_release.py source --tag "$GITHUB_REF_NAME" --require-tag
      - name: Require the tagged commit on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Require a successful CI gate for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          success_count="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" \
            --jq '[.check_runs[] | select(.name == "CI gate" and .conclusion == "success")] | length')"
          if [[ "$success_count" == "0" ]]; then
            printf 'CI gate for %s has no successful check run.\n' "$GITHUB_SHA"
            exit 1
          fi

  statistical-qa:
    name: Release statistical calibration / 500 simulations
    needs: verify-source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        with:
          toolchain: stable
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: "3.13"
          enable-cache: true
          cache-suffix: release-statistical-qa
      - name: Install the statistics test environment
        run: uv sync --frozen --group dev --extra statistics
      - name: Check decay coverage and event pointwise/simultaneous error rates
        env:
          LACUNA_RELEASE_CALIBRATION_SIMULATIONS: "500"
        run: >-
          uv run --no-sync pytest
          tests/statistical/test_decay_event_release_calibration.py
          --fail-on-skip
          --junitxml=release-statistical-junit.xml
      - name: Retain release statistical evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-statistical-calibration
          path: release-statistical-junit.xml
          if-no-files-found: error
          retention-days: 90

  source-distribution:
    name: Source distribution
    needs: [verify-source, statistical-qa]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the source distribution
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          maturin-version: v1.14.1
          args: --out dist
      - name: Retain the source distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  wheels:
    name: Wheel / ${{ matrix.platform }}
    needs: [verify-source, statistical-qa]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
            smoke-python: .wheel-smoke/bin/python
            smoke-cli: .wheel-smoke/bin/lacuna
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
            smoke-python: .wheel-smoke/bin/python
            smoke-cli: .wheel-smoke/bin/lacuna
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            manylinux: "off"
            smoke-python: .wheel-smoke/bin/python
            smoke-cli: .wheel-smoke/bin/lacuna
          - platform: windows-x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            manylinux: "off"
            smoke-python: .wheel-smoke/Scripts/python.exe
            smoke-cli: .wheel-smoke/Scripts/lacuna.exe
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python for wheel smoke testing
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: "3.13"
          enable-cache: true
          cache-suffix: release-${{ matrix.platform }}
      - name: Build the native wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.14.1
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --compatibility pypi --out dist
      - name: Install the wheel in a clean environment
        run: |
          uv venv .wheel-smoke --python 3.13
          uv pip install --python "${{ matrix.smoke-python }}" dist/*.whl
      - name: Exercise the installed wheel and native extension
        run: |
          "${{ matrix.smoke-python }}" .github/scripts/wheel_smoke.py
          "${{ matrix.smoke-cli }}" doctor --json --strict
      - name: Retain the verified wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-wheel-${{ matrix.platform }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 30

  options-distribution:
    name: Options extension distribution
    needs: [verify-source, wheels]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: "3.13"
          enable-cache: true
          cache-suffix: release-options
      - name: Install the locked pure-Python build backend
        run: uv sync --frozen --group dev --no-install-project
      - name: Build the options wheel and source distribution
        run: >-
          uv build --package lacuna-options
          --no-build-isolation
          --out-dir dist/options
      - name: Download the verified Linux core wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-wheel-linux-x86_64
          path: dist/core
      - name: Install both distributions into a clean environment
        run: |
          uv venv .options-smoke --python 3.13
          uv pip install --python .options-smoke/bin/python dist/core/*.whl dist/options/*.whl
      - name: Exercise the installed options extension
        run: .options-smoke/bin/python .github/scripts/options_wheel_smoke.py
      - name: Retain the options distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-options-distributions
          path: |
            dist/options/*.whl
            dist/options/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  verify-artifacts:
    name: Verify distribution set
    needs: [source-distribution, wheels, options-distribution]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download every release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify filenames, tags, metadata, and packaged resources
        run: python .github/scripts/verify_release.py artifacts --tag "$GITHUB_REF_NAME" --dist dist
      - name: Retain the verified release set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-release-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 90

  github-release:
    name: Publish GitHub release
    needs: verify-artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-release-distributions
          path: dist
      - name: Attest every distribution from its checksum manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            dist/*.whl dist/*.tar.gz dist/SHA256SUMS \
            --verify-tag \
            --title "Lacuna $GITHUB_REF_NAME" \
            --notes-file ".github/release-notes/${GITHUB_REF_NAME}.md" \
            "${release_flags[@]}"

  pypi-core:
    name: Publish lacuna-quant to PyPI
    needs: github-release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/lacuna-quant/
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Download the verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-release-distributions
          path: dist
      - name: Isolate the core distribution set
        run: |
          mkdir -p publish/core
          cp dist/lacuna_quant-*.whl dist/lacuna_quant-*.tar.gz publish/core/
      - name: Publish the verified core distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1 2026-08-27
        with:
          packages-dir: publish/core/
          skip-existing: true

  pypi-options:
    name: Publish lacuna-options to PyPI
    needs: pypi-core
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi-options
      url: https://pypi.org/project/lacuna-options/
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Download the verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-release-distributions
          path: dist
      - name: Isolate the options distribution set
        run: |
          mkdir -p publish/options
          cp dist/lacuna_options-*.whl dist/lacuna_options-*.tar.gz publish/options/
      - name: Publish the verified options distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1 2026-08-27
        with:
          packages-dir: publish/options/
          skip-existing: true

  pypi-smoke:
    name: PyPI installation smoke
    needs: pypi-options
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out release smoke tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: "3.13"
          enable-cache: false
      - name: Resolve the exact published versions
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import tomllib

          root = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          options = tomllib.loads(
              Path("extensions/lacuna-options/pyproject.toml").read_text(encoding="utf-8")
          )
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as environment:
              environment.write(f"CORE_VERSION={root['project']['version']}\n")
              environment.write(f"OPTIONS_VERSION={options['project']['version']}\n")
          PY
      - name: Install both distributions from PyPI
        run: |
          uv venv .pypi-smoke --python 3.13
          installed=false
          for attempt in {1..18}; do
            if uv pip install \
              --python .pypi-smoke/bin/python \
              --refresh \
              --index-url https://pypi.org/simple \
              "lacuna-quant==$CORE_VERSION" \
              "lacuna-options==$OPTIONS_VERSION"; then
              installed=true
              break
            fi
            printf 'PyPI has not indexed both distributions yet (attempt %s/18).\n' "$attempt"
            sleep 10
          done
          if [[ "$installed" != "true" ]]; then
            exit 1
          fi
      - name: Exercise the PyPI-installed distributions
        run: |
          .pypi-smoke/bin/python .github/scripts/wheel_smoke.py
          .pypi-smoke/bin/python .github/scripts/options_wheel_smoke.py
          .pypi-smoke/bin/lacuna doctor --json --strict

  gate:
    name: Release gate
    if: ${{ !cancelled() }}
    needs: [verify-source, statistical-qa, source-distribution, wheels, options-distribution, verify-artifacts, github-release, pypi-core, pypi-options, pypi-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require every release layer
        env:
          GITHUB_RELEASE: ${{ needs.github-release.result }}
          PYPI_CORE: ${{ needs.pypi-core.result }}
          PYPI_OPTIONS: ${{ needs.pypi-options.result }}
          PYPI_SMOKE: ${{ needs.pypi-smoke.result }}
          RELEASE_ARTIFACTS: ${{ needs.verify-artifacts.result }}
          RELEASE_SOURCE: ${{ needs.verify-source.result }}
          STATISTICAL_QA: ${{ needs.statistical-qa.result }}
          SDIST: ${{ needs.source-distribution.result }}
          WHEELS: ${{ needs.wheels.result }}
          OPTIONS: ${{ needs.options-distribution.result }}
        run: |
          for result in "$RELEASE_SOURCE" "$STATISTICAL_QA" "$SDIST" "$WHEELS" "$OPTIONS" "$RELEASE_ARTIFACTS" "$GITHUB_RELEASE" "$PYPI_CORE" "$PYPI_OPTIONS" "$PYPI_SMOKE"; do
            if [[ "$result" != "success" ]]; then
              printf 'A required release layer finished with status: %s\n' "$result"
              exit 1
            fi
          done
