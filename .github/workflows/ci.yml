name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  UV_NO_PROGRESS: "1"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: "3.13"
          enable-cache: true
          cache-suffix: quality
      - name: Install quality dependencies from the lockfile
        run: uv sync --frozen --group dev --no-install-project
      - name: Validate GitHub Actions syntax and expressions
        run: |
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --output /tmp/actionlint-1.7.12.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '%s  %s\n' \
            '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' \
            '/tmp/actionlint-1.7.12.tar.gz' | sha256sum --check
          mkdir -p /tmp/actionlint-1.7.12
          tar -xzf /tmp/actionlint-1.7.12.tar.gz -C /tmp/actionlint-1.7.12
          /tmp/actionlint-1.7.12/actionlint .github/workflows/*.yml
      - name: Check Python formatting
        run: uv run --no-sync ruff format --check .
      - name: Lint Python
        run: uv run --no-sync ruff check .
      - name: Type-check the public package
        run: uv run --no-sync mypy
      - name: Check repository whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            git diff --check "$BASE_SHA" "$GITHUB_SHA"
          else
            git show --check --format= "$GITHUB_SHA"
          fi

  python:
    name: Python / ${{ matrix.platform }} / ${{ matrix.python-version }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: Linux
            python-version: "3.11"
            pytest-args: --junitxml=junit.xml
          - runner: ubuntu-latest
            platform: Linux
            python-version: "3.12"
            pytest-args: --junitxml=junit.xml
          - runner: ubuntu-latest
            platform: Linux
            python-version: "3.13"
            pytest-args: >-
              --junitxml=junit.xml
              --cov=lacuna
              --cov-branch
              --cov-report=term-missing:skip-covered
              --cov-report=xml:coverage.xml
              --cov-fail-under=80
          - runner: ubuntu-latest
            platform: Linux
            python-version: "3.14"
            pytest-args: --junitxml=junit.xml
          - runner: macos-latest
            platform: macOS
            python-version: "3.13"
            pytest-args: --junitxml=junit.xml
          - runner: windows-latest
            platform: Windows
            python-version: "3.13"
            pytest-args: --junitxml=junit.xml
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        with:
          toolchain: stable
      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-suffix: tests-${{ matrix.python-version }}
      - name: Install test environment from the lockfile
        run: uv sync --frozen --group dev
      - name: Run the complete Python suite
        env:
          PYTEST_ARGS: ${{ matrix.pytest-args }}
        run: |
          read -r -a pytest_args <<< "$PYTEST_ARGS"
          uv run --no-sync pytest "${pytest_args[@]}"
      - name: Retain test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-${{ matrix.platform }}-py${{ matrix.python-version }}
          path: |
            junit.xml
            coverage.xml
          if-no-files-found: warn
          retention-days: 7

  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust with quality components
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        with:
          toolchain: stable
          components: clippy,rustfmt
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Verify reviewed Rust boundary dependencies and licenses
        run: python .github/scripts/check_rust_boundary.py
      - name: Install the pinned RustSec audit client
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Reject vulnerable, unmaintained, unsound, or yanked Rust dependencies
        run: cargo audit --deny warnings --file Cargo.lock
      - name: Lint every Rust target
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test the Rust workspace
        run: cargo test --locked --workspace
      - name: Compile Criterion benchmarks
        run: cargo bench --locked --bench kernels --no-run

  rust-msrv:
    name: Rust / MSRV 1.85
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the minimum supported Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        with:
          toolchain: 1.85.0
      - name: Compile every target at the MSRV
        run: cargo check --locked --workspace --all-targets
      - name: Test the workspace at the MSRV
        run: cargo test --locked --workspace

  interoperability:
    name: Full extras / no skips
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        with:
          toolchain: stable
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: "3.13"
          enable-cache: true
          cache-suffix: interoperability
      - name: Install every public optional extra
        run: >-
          uv sync --frozen --group dev
          --extra all
      - name: Run the full suite and reject every skip
        run: >-
          uv run --no-sync pytest
          --ignore=tests/browser
          --fail-on-skip
          --junitxml=junit.xml
      - name: Retain interoperability evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: interoperability-py3.13
          path: junit.xml
          if-no-files-found: warn
          retention-days: 7

  extras:
    name: Extra / ${{ matrix.extra }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - extra: statistics
            tests: tests/unit/test_decay_fit.py tests/reference/test_scipy_signal_reference.py
          - extra: report
            tests: tests/unit/test_report.py
          - extra: pandas
            tests: tests/unit/test_factor_panel_adapter.py tests/integration/test_adapter_matrix.py
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        with:
          toolchain: stable
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: "3.13"
          enable-cache: true
          cache-suffix: extra-${{ matrix.extra }}
      - name: Install only the affected extra
        run: uv sync --frozen --group dev --extra ${{ matrix.extra }}
      - name: Test the affected extra with no skips
        env:
          EXTRA_TESTS: ${{ matrix.tests }}
        run: |
          read -r -a extra_tests <<< "$EXTRA_TESTS"
          uv run --no-sync pytest --fail-on-skip "${extra_tests[@]}" --junitxml=junit.xml
      - name: Retain extra-specific evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extra-${{ matrix.extra }}-py3.13
          path: junit.xml
          if-no-files-found: error
          retention-days: 7

  extensions:
    name: Optional extensions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        with:
          toolchain: stable
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: "3.13"
          enable-cache: true
          cache-suffix: extensions
      - name: Install every workspace package from the lockfile
        run: uv sync --frozen --all-packages --group dev
      - name: Check the options extension
        run: |
          uv run --no-sync ruff format --check extensions/lacuna-options
          uv run --no-sync ruff check extensions/lacuna-options
          uv run --no-sync mypy \
            --config-file extensions/lacuna-options/pyproject.toml \
            extensions/lacuna-options/src/lacuna_options
      - name: Test the options extension
        run: >-
          uv run --no-sync pytest extensions/lacuna-options/tests
          --cov=lacuna_options
          --cov-branch
          --cov-report=term-missing:skip-covered
          --cov-report=xml:options-coverage.xml
          --cov-fail-under=85
          --junitxml=options-junit.xml
      - name: Retain extension test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: options-extension-py3.13
          path: |
            options-coverage.xml
            options-junit.xml
          if-no-files-found: error
          retention-days: 7

  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: "3.13"
          enable-cache: true
          cache-suffix: documentation
      - name: Install documentation dependencies from the lockfile
        run: uv sync --frozen --group docs --no-install-project
      - name: Build documentation in strict mode
        run: uv run --no-sync mkdocs build --strict
      - name: Retain the rendered handbook
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lacuna-handbook
          path: site/
          if-no-files-found: error
          retention-days: 7

  report-browser:
    name: Plotly report / pinned Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        with:
          toolchain: stable
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: "3.13"
          enable-cache: true
          cache-suffix: report-browser
      - name: Install report and pinned browser QA dependencies
        run: uv sync --frozen --group dev --group browser-qa --extra report
      - name: Install the Chromium revision pinned by Playwright 1.55.0
        run: uv run --no-sync playwright install --with-deps chromium
      - name: Render report in a real browser
        env:
          LACUNA_BROWSER_ARTIFACT_DIR: browser-artifacts
        run: >-
          uv run --no-sync pytest tests/browser
          --fail-on-skip
          --junitxml=browser-junit.xml
      - name: Retain reviewed browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plotly-report-chromium
          path: |
            browser-artifacts/plotly-signal-report.png
            browser-junit.xml
          if-no-files-found: error
          retention-days: 14

  benchmark-regression:
    name: Benchmark / same-runner legacy guard
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      POLARS_MAX_THREADS: "2"
    steps:
      - name: Check out source and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        with:
          toolchain: stable
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: "3.13"
          enable-cache: true
          cache-suffix: benchmark-regression
      - name: Resolve the comparison checkout
        id: baseline
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base_sha="$EVENT_BASE_SHA"
          if [[ -z "$base_sha" || "$base_sha" == "0000000000000000000000000000000000000000" ]]; then
            base_sha="$(git rev-parse HEAD^)"
          fi
          base_dir="$(mktemp -d)"
          git worktree add --detach "$base_dir" "$base_sha"
          echo "directory=$base_dir" >> "$GITHUB_OUTPUT"
      - name: Measure the baseline on this runner
        working-directory: ${{ steps.baseline.outputs.directory }}
        run: |
          uv sync --frozen --group dev
          uv run --no-sync lacuna bench --tier small --repetitions 3 --warmups 1 --no-native --out baseline.json
      - name: Measure the candidate on the same runner
        run: |
          uv sync --frozen --group dev
          uv run --no-sync lacuna bench --tier small --repetitions 3 --warmups 1 --no-native --out candidate.json
          cp "${{ steps.baseline.outputs.directory }}/baseline.json" baseline.json
      - name: Enforce checksum equality and the 15 percent median budget
        run: >-
          python .github/scripts/compare_benchmarks.py
          baseline.json
          candidate.json
          --maximum-regression 0.15
          --minimum-absolute-regression 0.001
      - name: Retain benchmark evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-same-runner
          path: |
            baseline.json
            candidate.json
          if-no-files-found: error
          retention-days: 14

  package:
    name: Package
    needs: [quality, python, rust, rust-msrv, interoperability, extras, extensions, documentation, report-browser, benchmark-regression]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        with:
          toolchain: stable
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: "3.13"
          enable-cache: true
          cache-suffix: package
      - name: Install build dependencies from the lockfile
        run: uv sync --frozen --all-packages --group dev
      - name: Build a source distribution and rebuild its wheel
        run: uv run --no-sync maturin build --release --locked --sdist --out dist
      - name: Build the separately versioned options extension
        run: uv build --package lacuna-options --no-build-isolation --out-dir dist
      - name: Resolve built wheel paths
        run: |
          echo "CORE_WHEEL=$(find dist -maxdepth 1 -name 'lacuna_quant-*.whl' -print -quit)" >> "$GITHUB_ENV"
          echo "OPTIONS_WHEEL=$(find dist -maxdepth 1 -name 'lacuna_options-*.whl' -print -quit)" >> "$GITHUB_ENV"
      - name: Install and exercise the core-only wheel
        run: |
          uv venv .wheel-core --python 3.13
          uv pip install --python .wheel-core/bin/python "$CORE_WHEEL"
          .wheel-core/bin/python .github/scripts/wheel_smoke.py
          .wheel-core/bin/lacuna doctor --json --strict
      - name: Install and exercise each affected extra
        run: |
          for extra in statistics report pandas; do
            uv venv ".wheel-$extra" --python 3.13
            uv pip install --python ".wheel-$extra/bin/python" "${CORE_WHEEL}[$extra]"
            ".wheel-$extra/bin/python" .github/scripts/extra_wheel_smoke.py "$extra"
          done
      - name: Jointly install and exercise the options extension
        run: |
          uv venv .wheel-options --python 3.13
          uv pip install --python .wheel-options/bin/python "$CORE_WHEEL" "$OPTIONS_WHEEL"
          .wheel-options/bin/python .github/scripts/options_wheel_smoke.py
      - name: Retain distributable artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lacuna-linux-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  abi3:
    name: ABI3 / same Linux wheel / Python ${{ matrix.python-version }}
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out smoke contracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: ${{ matrix.python-version }}
          enable-cache: false
      - name: Download the one cp311-abi3 Linux wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lacuna-linux-dist
          path: dist
      - name: Install the exact wheel without rebuilding
        run: |
          uv venv .abi-smoke --python ${{ matrix.python-version }}
          uv pip install --python .abi-smoke/bin/python dist/lacuna_quant-*.whl
      - name: Exercise typed arrays, grouped IC, PBO, and public parity
        run: |
          .abi-smoke/bin/python .github/scripts/wheel_smoke.py
          .abi-smoke/bin/lacuna doctor --json --strict

  package-regression:
    name: Package / v0.13 import and wheel guard
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source and release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        with:
          toolchain: stable
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: "3.13"
          enable-cache: true
          cache-suffix: package-regression
      - name: Resolve the frozen v0.13 source
        id: baseline
        run: |
          baseline_dir="$(mktemp -d)"
          git worktree add --detach "$baseline_dir" v0.13.0
          echo "directory=$baseline_dir" >> "$GITHUB_OUTPUT"
      - name: Build the v0.13 wheel on this runner
        working-directory: ${{ steps.baseline.outputs.directory }}
        run: |
          uv sync --frozen --group dev
          uv run --no-sync maturin build --release --locked --out "$GITHUB_WORKSPACE/baseline-dist"
      - name: Download the candidate wheel built by CI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lacuna-linux-dist
          path: candidate-dist
      - name: Install baseline and candidate wheels in clean environments
        run: |
          uv venv .baseline-import --python 3.13
          uv venv .candidate-import --python 3.13
          uv pip install --python .baseline-import/bin/python baseline-dist/lacuna_quant-*.whl
          uv pip install --python .candidate-import/bin/python candidate-dist/lacuna_quant-*.whl
      - name: Enforce import latency and wheel-size budgets
        run: >-
          python .github/scripts/compare_package_metrics.py
          --baseline-wheel baseline-dist/lacuna_quant-*.whl
          --candidate-wheel candidate-dist/lacuna_quant-*.whl
          --baseline-python .baseline-import/bin/python
          --candidate-python .candidate-import/bin/python
          --maximum-regression 0.15
          --maximum-wheel-growth 0.20
          --out package-regression.json
      - name: Retain package regression evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-regression
          path: package-regression.json
          if-no-files-found: error
          retention-days: 30

  gate:
    name: CI gate
    if: ${{ !cancelled() }}
    needs: [quality, python, rust, rust-msrv, interoperability, extras, extensions, documentation, report-browser, benchmark-regression, package, abi3, package-regression]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require every CI layer
        env:
          QUALITY: ${{ needs.quality.result }}
          PYTHON: ${{ needs.python.result }}
          RUST: ${{ needs.rust.result }}
          RUST_MSRV: ${{ needs.rust-msrv.result }}
          INTEROPERABILITY: ${{ needs.interoperability.result }}
          EXTRAS: ${{ needs.extras.result }}
          EXTENSIONS: ${{ needs.extensions.result }}
          DOCUMENTATION: ${{ needs.documentation.result }}
          REPORT_BROWSER: ${{ needs.report-browser.result }}
          BENCHMARK_REGRESSION: ${{ needs.benchmark-regression.result }}
          PACKAGE: ${{ needs.package.result }}
          ABI3: ${{ needs.abi3.result }}
          PACKAGE_REGRESSION: ${{ needs.package-regression.result }}
        run: |
          for result in "$QUALITY" "$PYTHON" "$RUST" "$RUST_MSRV" "$INTEROPERABILITY" "$EXTRAS" "$EXTENSIONS" "$DOCUMENTATION" "$REPORT_BROWSER" "$BENCHMARK_REGRESSION" "$PACKAGE" "$ABI3" "$PACKAGE_REGRESSION"; do
            if [[ "$result" != "success" ]]; then
              printf 'A required CI layer finished with status: %s\n' "$result"
              exit 1
            fi
          done
          {
            echo "### Lacuna CI passed"
            echo
            echo "All quality, compatibility, native, documentation, interoperability, and package gates succeeded."
          } >> "$GITHUB_STEP_SUMMARY"
