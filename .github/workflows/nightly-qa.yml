name: Nightly statistical QA

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-statistical-qa
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  UV_NO_PROGRESS: "1"

jobs:
  calibration:
    name: Event and decay calibration / 500 simulations
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        with:
          toolchain: stable
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: "3.13"
          enable-cache: true
          cache-suffix: nightly-statistical-qa
      - name: Install the statistics test environment
        run: uv sync --frozen --group dev --extra statistics
      - name: Check fixed-seed coverage and simultaneous-band false positives
        env:
          LACUNA_RELEASE_CALIBRATION_SIMULATIONS: "500"
        run: >-
          uv run --no-sync pytest
          tests/statistical/test_decay_event_release_calibration.py
          --fail-on-skip
          --junitxml=nightly-statistical-junit.xml
      - name: Retain nightly statistical evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-statistical-calibration
          path: nightly-statistical-junit.xml
          if-no-files-found: error
          retention-days: 30

  native-admission:
    name: Native admission / pinned medium tier
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      POLARS_MAX_THREADS: "2"
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        with:
          toolchain: stable
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: "3.13"
          enable-cache: true
          cache-suffix: nightly-native-admission
      - name: Install the locked native test environment
        run: uv sync --frozen --group dev
      - name: Prepare native evidence directory
        run: mkdir -p native-admission
      - name: Reproduce grouped-IC admission on skewed groups
        run: >-
          uv run --no-sync python .github/scripts/native_migration_benchmark.py run
          --candidate-id R-01
          --public-operation signal.ic
          --reference-case migration.signal.ic.skewed.reference
          --candidate-case migration.signal.ic.skewed.native
          --tier medium
          --warmups 2
          --repetitions 7
          --dimension rows=1625750
          --dimension groups=1000
          --dimension horizons=3
          --dimension 'group_shape="cyclic:3,250,1250,5000"'
          --public-latency-share 1.0
          --out native-admission/r01.json
      - name: Reproduce PBO admission
        run: >-
          uv run --no-sync python .github/scripts/native_migration_benchmark.py run
          --candidate-id R-08
          --public-operation validation.probability_of_backtest_overfitting
          --reference-case migration.validation.pbo.reference
          --candidate-case migration.validation.pbo.native
          --tier medium
          --warmups 2
          --repetitions 7
          --dimension rows=1008
          --dimension strategies=12
          --dimension partitions=14
          --dimension combinations=3432
          --public-latency-share 1.0
          --out native-admission/r08.json
      - name: Require exact-source native admission evidence
        run: |
          uv run --no-sync python .github/scripts/native_migration_benchmark.py validate native-admission/r01.json --candidate-id R-01 --source-commit "$GITHUB_SHA" --require-state ADMITTED
          uv run --no-sync python .github/scripts/native_migration_benchmark.py validate native-admission/r08.json --candidate-id R-08 --source-commit "$GITHUB_SHA" --require-state ADMITTED
      - name: Retain authoritative native evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-native-admission
          path: native-admission/*.json
          if-no-files-found: error
          retention-days: 90

  native-adversarial:
    name: Native property and bounded-fuzz QA
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        with:
          toolchain: stable
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: "3.13"
          enable-cache: true
          cache-suffix: nightly-native-adversarial
      - name: Install the locked native test environment
        run: uv sync --frozen --group dev
      - name: Run Rust boundary and algebra properties
        run: cargo test --locked --workspace
      - name: Run bounded native differential fuzzing
        run: >-
          uv run --no-sync pytest
          tests/integration/test_native.py
          tests/property/test_native_differential.py
          --fail-on-skip
          --junitxml=nightly-native-junit.xml
      - name: Retain native adversarial evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-native-adversarial
          path: nightly-native-junit.xml
          if-no-files-found: error
          retention-days: 30
