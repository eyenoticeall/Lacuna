name: Nightly statistical QA

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-statistical-qa
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  UV_NO_PROGRESS: "1"

jobs:
  calibration:
    name: Event and decay calibration / 500 simulations
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        with:
          toolchain: stable
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: "3.13"
          enable-cache: true
          cache-suffix: nightly-statistical-qa
      - name: Install the statistics test environment
        run: uv sync --frozen --group dev --extra statistics
      - name: Check fixed-seed coverage and simultaneous-band false positives
        env:
          LACUNA_RELEASE_CALIBRATION_SIMULATIONS: "500"
        run: >-
          uv run --no-sync pytest
          tests/statistical/test_decay_event_release_calibration.py
          --fail-on-skip
          --junitxml=nightly-statistical-junit.xml
      - name: Retain nightly statistical evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-statistical-calibration
          path: nightly-statistical-junit.xml
          if-no-files-found: error
          retention-days: 30
