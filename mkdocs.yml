site_name: Lacuna
site_description: Quantitative research validation for finding where alpha breaks.
docs_dir: docs
theme:
  name: material
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    scheme: slate
    primary: black
    accent: teal
nav:
  - Home: index.md
  - Getting started: getting-started/index.md
  - Concepts:
      - Architecture: concepts/architecture.md
      - Semantic data model: concepts/data-model.md
      - Evidence model: concepts/evidence-model.md
  - Engineering:
      - Handbook: development/index.md
      - Repository layout: development/repository-layout.md
      - Python API design: development/python-api.md
      - Native Rust core: development/native-core.md
      - Data boundary: development/data-boundary.md
      - Testing strategy: development/testing.md
      - Continuous integration: development/continuous-integration.md
      - Performance: development/performance.md
      - Contributing a method: development/contributing-a-method.md
      - Release engineering: development/release.md
      - Implementation roadmap: development/roadmap.md
      - v1 readiness ledger: development/v1-readiness.md
  - Subsystems:
      - Signals and labels: subsystems/signal-labels.md
      - Financial validation: subsystems/financial-validation.md
      - Robustness: subsystems/robustness.md
      - Costs and capacity: subsystems/costs-capacity.md
      - Bias and point-in-time safety: subsystems/bias-point-in-time.md
      - Audit and reporting: subsystems/audit-reporting.md
      - Experiments and reproducibility: subsystems/experiments-reproducibility.md
      - Adapters, execution, and plugins: subsystems/adapters-execution-plugins.md
      - Options-research extension: subsystems/options-extension.md
  - Methodology:
      - Principles: methodology/principles.md
      - Forward-return labels: methodology/forward-returns.md
      - Information coefficient: methodology/information-coefficient.md
      - Quantiles, turnover, and decay: methodology/quantiles-turnover-decay.md
      - Temporal validation: methodology/temporal-validation.md
      - Bootstrap inference: methodology/bootstrap.md
      - Advanced inference: methodology/advanced-inference.md
      - Experiment lineage and multiple testing: methodology/experiments-multiple-testing.md
      - Robustness analysis: methodology/robustness-analysis.md
      - Regime analysis: methodology/regime-analysis.md
      - Trading costs, liquidity, and capacity: methodology/trading-costs-capacity.md
      - Point-in-time data correctness: methodology/point-in-time-data-correctness.md
      - Audit score: methodology/audit-scoring.md
  - Agent handbook:
      - Overview: agents/index.md
      - Implementation playbook: agents/implementation-playbook.md
      - Review checklist: agents/review-checklist.md
  - Reference:
      - Glossary: reference/glossary.md
      - Public API compatibility: reference/public-api.md
      - Result schema: reference/result-schema.md
      - Reproducibility bundle: reference/reproducibility-bundle.md
      - Standardized audit: reference/standardized-audit.md
      - Architecture decisions: reference/architecture-decisions.md
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
